# ─────────────────────────────────────────────────────────────────────────────
# DKU Leadership Resource Bank — Nginx configuration (parameterized; D14 facts
# pending). Defaults: Linux + Nginx + Node 20 (systemd) — 01-architecture §9.
#
# Replace: __DOMAIN__, __TLS_CERT__, __TLS_KEY__, __CLIENT_DIST__ (absolute path
# to client/dist), __SERVER_PORT__ (Express port, default 8787).
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Redirect to HTTPS once the university certificate is installed.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;

    # compression (verified against the production-parity measurement server —
    # brotli/gzip over JS+CSS+SVG is what keeps the transfer budget)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

    client_max_body_size 256k;

    # static client (Vite build output) — hashed assets are immutable
    root __CLIENT_DIST__;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /seed/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SSE endpoint: buffering off, long read timeout
    location = /api/stream {
        proxy_pass http://127.0.0.1:__SERVER_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;
    }

    # API → Express (Node 20, systemd unit rb.service)
    location /api/ {
        proxy_pass http://127.0.0.1:__SERVER_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
